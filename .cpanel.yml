---
deployment:
  tasks:
    - export REPO=/home/elivokwjs/repositories/example-app
    - export WEB=/home/elivokwjs/public_html
    - /bin/cp -R $REPO/public/. $WEB/
    - cd $REPO && /opt/cpanel/composer/bin/composer install --no-dev --optimize-autoloader
    - cd $REPO && /usr/local/bin/php artisan migrate --force
    - cd $REPO && /usr/local/bin/php artisan config:cache
    - cd $REPO && /usr/local/bin/php artisan view:cache